name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backend tests
        run: python -m unittest discover -v

      - name: Check Python syntax
        run: python -m py_compile server.py test_server.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Functions dependencies
        run: npm ci --prefix functions

      - name: Check backend function syntax
        run: npm --prefix functions run check

      - name: Test backend function logic
        run: npm --prefix functions test

      - name: Check frontend JavaScript syntax
        run: node --check app.js

      - name: Test frontend playback behavior
        run: node test_app.js
